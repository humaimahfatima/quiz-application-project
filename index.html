<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <div class="quiz-box mx-auto">

            <div class="text-center">
                <div class="emoji">🌿</div>
                <h2>Cozy Quiz</h2>
                <p class="subtitle">Small steps, big progress!</p>
            </div>

            <div id="home">
                <div class="welcome">
                    <h4>Ready to play?</h4>
                    <p>Answer the questions and check your score.</p>
                    <div class="big-emoji">📚 ☕</div>
                </div>

                <button id="start-btn" class="main-btn">
                    Start Quiz →
                </button>
            </div>

            <div id="quiz" style="display: none;">

                <div class="d-flex justify-content-between mb-2">
                    <span id="question-number"></span>
                    <span id="score">Score: 0</span>
                </div>

                <div class="progress mb-4">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <h5 id="question"></h5>

                <div id="options" class="mt-4"></div>

                <p id="message" class="mt-3"></p>

                <button id="next-btn" class="main-btn" disabled>
                    Next →
                </button>
            </div>

            <div id="result-page" style="display: none;">
                <div class="big-emoji">🏆</div>
                <h3>Quiz Completed!</h3>
                <p>Your final score is:</p>
                <h2 id="final-score"></h2>
                <p id="final-message"></p>

                <button id="restart-btn" class="main-btn">
                    Play Again ↻
                </button>
            </div>

            <p class="footer">Made with ♡ and a little learning</p>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
